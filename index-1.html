<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vignan Group of Schools - learning, confidence, and a bright future.">
  <meta name="theme-color" content="#102b55">
  <title>Vignan Group of Schools | Bhongir</title>

  <!-- Google Fonts: the site still works if the internet is unavailable. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. GLOBAL SETTINGS, COLORS AND RESET
       ========================================================= */
    :root {
      --navy: #102b55;
      --navy-dark: #091d3b;
      --blue: #1769aa;
      --blue-light: #eaf4ff;
      --gold: #f2b544;
      --gold-dark: #d89519;
      --ink: #17243a;
      --muted: #64748b;
      --paper: #ffffff;
      --soft: #f5f8fc;
      --line: #e4eaf2;
      --green: #16865b;
      --shadow: 0 18px 50px rgba(16, 43, 85, .11);
      --radius: 22px;
      --page-width: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "DM Sans", Arial, sans-serif;
      line-height: 1.65;
      overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .container { width: min(var(--page-width), calc(100% - 40px)); margin-inline: auto; }
    .section { padding: 88px 0; }
    .section.soft { background: var(--soft); }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 9px;
      color: var(--blue); font-size: .78rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .14em;
    }
    .eyebrow::before { content: ""; width: 25px; height: 2px; background: var(--gold); }
    .section-heading {
      max-width: 720px; margin: 12px 0 14px;
      color: var(--navy); font: 800 clamp(2rem, 4vw, 3.2rem)/1.12 "Playfair Display", Georgia, serif;
    }
    .section-intro { max-width: 690px; color: var(--muted); margin: 0; }
    .section-top { margin-bottom: 38px; }
    .gold-text { color: var(--gold); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 48px; padding: 12px 21px; border: 0; border-radius: 999px;
      font-weight: 800; transition: transform .2s, box-shadow .2s, background .2s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,.15); }
    .btn-primary { color: var(--navy-dark); background: var(--gold); }
    .btn-outline { color: white; border: 1px solid rgba(255,255,255,.55); background: transparent; }
    .btn-blue { color: white; background: var(--blue); }
    .tag {
      display: inline-block; padding: 6px 11px; border-radius: 999px;
      color: var(--blue); background: var(--blue-light); font-size: .78rem; font-weight: 800;
    }

    /* =========================================================
       2. ANNOUNCEMENT BAR AND NAVIGATION
       ========================================================= */
    .announcement {
      color: #fff; background: var(--navy-dark); font-size: .82rem;
    }
    .announcement-inner {
      min-height: 36px; display: flex; align-items: center;
      justify-content: space-between; gap: 15px; flex-wrap: wrap;
    }
    .announcement a { color: var(--gold); font-weight: 800; }
    .site-header {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(255,255,255,.96); backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(228,234,242,.9);
    }
    .nav-wrap { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 22px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-logo {
      width: 54px; height: 54px; flex: 0 0 54px; object-fit: contain;
      border-radius: 14px; background: #fff; border: 1px solid var(--line);
    }
    .brand-name { color: var(--navy); font-weight: 900; line-height: 1.12; letter-spacing: -.03em; }
    .brand-name small { display: block; margin-top: 5px; color: var(--muted); font-size: .67rem; letter-spacing: .11em; }
    .nav-links { display: flex; align-items: center; gap: 22px; }
    .nav-links a { color: #34445d; font-size: .9rem; font-weight: 700; transition: color .2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--blue); }
    .nav-cta { white-space: nowrap; }
    .menu-toggle {
      display: none; width: 44px; height: 44px; border: 1px solid var(--line);
      border-radius: 12px; background: white; color: var(--navy); font-size: 1.35rem;
    }

    /* =========================================================
       3. HERO / HOME SECTION
       ========================================================= */
    .hero {
      position: relative; isolation: isolate; overflow: hidden;
      color: white; background:
        radial-gradient(circle at 85% 18%, rgba(242,181,68,.22), transparent 25%),
        linear-gradient(120deg, #091d3b 0%, #102b55 55%, #1769aa 100%);
    }
    .hero::before, .hero::after {
      content: ""; position: absolute; z-index: -1; border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
    }
    .hero::before { width: 520px; height: 520px; right: -160px; top: -190px; }
    .hero::after { width: 330px; height: 330px; right: -60px; top: -95px; }
    .hero-grid {
      min-height: 620px; display: grid; grid-template-columns: 1.05fr .95fr;
      align-items: center; gap: 45px; padding-block: 72px;
    }
    .hero-kicker {
      display: inline-flex; gap: 9px; align-items: center; padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.24); border-radius: 999px;
      color: #ffdf9e; background: rgba(255,255,255,.08); font-size: .8rem; font-weight: 800;
    }
    .hero h1 {
      margin: 20px 0; max-width: 700px;
      font: 800 clamp(2.7rem, 6vw, 5.1rem)/1.02 "Playfair Display", Georgia, serif;
      letter-spacing: -.04em;
    }
    .hero-copy { max-width: 590px; color: rgba(255,255,255,.82); font-size: 1.08rem; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 28px; }
    .hero-note { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 35px; color: rgba(255,255,255,.78); font-size: .85rem; }
    .hero-note span::before { content: "✓"; margin-right: 8px; color: var(--gold); font-weight: 900; }
    .hero-visual { position: relative; min-height: 430px; display: grid; place-items: center; }
    .hero-photo-frame {
      position: relative; width: min(100%, 500px); height: 390px; overflow: hidden;
      border: 8px solid rgba(255,255,255,.16); border-radius: 34px;
      background: linear-gradient(135deg, #dbeafe, #fef3c7); box-shadow: 0 30px 80px rgba(0,0,0,.28);
      transform: rotate(2deg);
    }
    .hero-photo-frame img { width: 100%; height: 100%; object-fit: cover; }
    .photo-placeholder {
      min-height: 100%; display: grid; place-items: center; padding: 25px;
      color: var(--navy); text-align: center; font-weight: 800;
      background: linear-gradient(145deg, #e8f2ff, #fff4d9);
    }
    .floating-card {
      position: absolute; left: -10px; bottom: 28px; padding: 17px 20px;
      color: var(--navy); background: white; border-radius: 18px; box-shadow: var(--shadow);
      transform: rotate(-3deg);
    }
    .floating-card strong { display: block; font: 800 1.7rem "Playfair Display", Georgia, serif; }
    .floating-card span { color: var(--muted); font-size: .8rem; font-weight: 700; }
    .hero-seal {
      position: absolute; right: -2px; top: 18px; width: 100px; height: 100px;
      display: grid; place-items: center; text-align: center; border-radius: 50%;
      color: var(--navy); background: var(--gold); font-size: .73rem; font-weight: 900;
      line-height: 1.2; transform: rotate(10deg); box-shadow: 0 15px 30px rgba(0,0,0,.18);
    }

    /* =========================================================
       4. QUICK FACTS STRIP
       ========================================================= */
    .facts-strip { position: relative; z-index: 2; margin-top: -34px; }
    .facts-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); overflow: hidden;
      border-radius: 20px; background: white; box-shadow: var(--shadow);
    }
    .fact { padding: 25px 18px; text-align: center; border-right: 1px solid var(--line); }
    .fact:last-child { border-right: 0; }
    .fact strong { display: block; color: var(--navy); font: 800 1.55rem "Playfair Display", Georgia, serif; }
    .fact span { color: var(--muted); font-size: .82rem; font-weight: 700; }

    /* =========================================================
       5. ABOUT SECTION
       ========================================================= */
    .about-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 55px; align-items: center; }
    .about-image {
      position: relative; min-height: 420px; overflow: hidden; border-radius: 28px;
      background: linear-gradient(135deg, #dcecff, #fff0cc); box-shadow: var(--shadow);
    }
    .about-image img { width: 100%; height: 420px; object-fit: cover; }
    .about-image .photo-placeholder { min-height: 420px; }
    .about-image-label {
      position: absolute; left: 20px; bottom: 20px; padding: 13px 17px;
      color: white; background: rgba(9,29,59,.88); border-radius: 13px; font-weight: 800;
    }
    .about-content p { color: var(--muted); }
    .about-points { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin: 25px 0 28px; }
    .about-point { display: flex; align-items: flex-start; gap: 10px; color: var(--navy); font-weight: 800; }
    .check-icon {
      width: 25px; height: 25px; flex: 0 0 25px; display: grid; place-items: center;
      color: var(--green); background: #e7f7ef; border-radius: 50%; font-size: .8rem;
    }

    /* =========================================================
       6. HORIZONTAL FEATURES RAIL
       ========================================================= */
    .feature-shell { position: relative; }
    .feature-rail {
      display: flex; gap: 18px; overflow-x: auto; padding: 8px 3px 22px;
      scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--gold) #e9eef5;
    }
    .feature-card {
      flex: 0 0 270px; min-height: 250px; padding: 25px; scroll-snap-align: start;
      border: 1px solid var(--line); border-radius: 20px; background: white;
      box-shadow: 0 10px 30px rgba(16,43,85,.06); transition: transform .2s, box-shadow .2s;
    }
    .feature-card:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
    .feature-icon {
      width: 55px; height: 55px; display: grid; place-items: center; margin-bottom: 19px;
      color: var(--navy); background: #fff2d6; border-radius: 17px; font-size: 1.55rem;
    }
    .feature-card h3 { margin: 0 0 8px; color: var(--navy); font-size: 1.12rem; }
    .feature-card p { margin: 0; color: var(--muted); font-size: .91rem; }
    .rail-hint { margin-top: 7px; color: var(--muted); font-size: .8rem; font-weight: 700; }

    /* =========================================================
       7. ACADEMICS / CLASSES
       ========================================================= */
    .class-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .class-card {
      padding: 24px 20px; border: 1px solid var(--line); border-radius: 18px;
      background: white; transition: .2s;
    }
    .class-card:hover { border-color: #9dc7ef; transform: translateY(-4px); }
    .class-card .number { color: var(--gold-dark); font: 800 2rem "Playfair Display", Georgia, serif; }
    .class-card h3 { margin: 6px 0; color: var(--navy); }
    .class-card p { margin: 0; color: var(--muted); font-size: .88rem; }

    /* =========================================================
       8. FOUNDATION PROGRAM
       ========================================================= */
    .foundation {
      position: relative; overflow: hidden; padding: 45px; color: white;
      border-radius: 28px; background: linear-gradient(115deg, #102b55, #1769aa);
      box-shadow: var(--shadow);
    }
    .foundation::after {
      content: "✦"; position: absolute; right: 35px; top: -55px;
      color: rgba(255,255,255,.08); font-size: 17rem; line-height: 1;
    }
    .foundation-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr .7fr; gap: 35px; align-items: center; }
    .foundation h2 { margin: 10px 0 15px; font: 800 clamp(2rem,4vw,3rem)/1.12 "Playfair Display", Georgia, serif; }
    .foundation p { max-width: 680px; color: rgba(255,255,255,.8); }
    .foundation-list { display: grid; gap: 12px; }
    .foundation-list div {
      padding: 15px 17px; border: 1px solid rgba(255,255,255,.2);
      border-radius: 14px; background: rgba(255,255,255,.1); font-weight: 800;
    }

    /* =========================================================
       9. FOUNDERS
       ========================================================= */
    .founder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; max-width: 850px; }
    .founder-card { overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: white; box-shadow: 0 10px 30px rgba(16,43,85,.06); }
    .founder-photo { height: 300px; background: linear-gradient(135deg, #e8f2ff, #fff0cc); }
    .founder-photo img { width: 100%; height: 100%; object-fit: cover; }
    .founder-photo .photo-placeholder { height: 100%; }
    .founder-info { padding: 22px; }
    .founder-info h3 { margin: 0 0 5px; color: var(--navy); font: 800 1.35rem "Playfair Display", Georgia, serif; }
    .founder-info p { margin: 0; color: var(--muted); font-size: .9rem; }

    /* =========================================================
       10. GALLERY
       ========================================================= */
    .gallery-grid { display: grid; grid-template-columns: 1.2fr .8fr .8fr; grid-auto-rows: 210px; gap: 14px; }
    .gallery-item { position: relative; overflow: hidden; border-radius: 18px; background: linear-gradient(135deg, #dcecff, #fff0cc); }
    .gallery-item:first-child { grid-row: span 2; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .gallery-item:hover img { transform: scale(1.06); }
    .gallery-item .photo-placeholder { height: 100%; font-size: .9rem; }
    .gallery-caption {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 35px 15px 13px;
      color: white; font-weight: 800; background: linear-gradient(transparent, rgba(0,0,0,.7));
    }

    /* =========================================================
       11. SCHOOL TIMINGS AND CONTACT
       ========================================================= */
    .contact-grid { display: grid; grid-template-columns: .85fr 1.15fr; gap: 30px; }
    .contact-panel {
      padding: 30px; border-radius: 22px; background: var(--navy); color: white;
    }
    .contact-panel h3 { margin-top: 0; font: 800 1.7rem "Playfair Display", Georgia, serif; }
    .contact-detail { display: flex; gap: 13px; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,.15); }
    .contact-detail:last-child { border-bottom: 0; }
    .contact-detail .symbol { width: 38px; height: 38px; flex: 0 0 38px; display: grid; place-items: center; border-radius: 12px; color: var(--navy); background: var(--gold); }
    .contact-detail small { display: block; color: rgba(255,255,255,.65); }
    .contact-detail a, .contact-detail strong { overflow-wrap: anywhere; font-weight: 800; }
    .contact-side {
      padding: 30px; border: 1px solid var(--line); border-radius: 22px; background: white;
    }
    .contact-side h3 { margin-top: 0; color: var(--navy); font: 800 1.7rem "Playfair Display", Georgia, serif; }
    .timing-box { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin: 18px 0; padding: 18px; border-radius: 15px; background: var(--blue-light); }
    .timing-box strong { color: var(--navy); font-size: 1.2rem; }
    .timing-box span { color: var(--muted); font-size: .85rem; }

    /* =========================================================
       12. FOOTER
       ========================================================= */
    .site-footer { padding: 55px 0 20px; color: rgba(255,255,255,.75); background: #081a34; }
    .footer-grid { display: grid; grid-template-columns: 1.3fr .7fr .8fr; gap: 40px; padding-bottom: 35px; }
    .footer-brand { color: white; font: 800 1.5rem "Playfair Display", Georgia, serif; }
    .site-footer p { max-width: 430px; color: rgba(255,255,255,.65); }
    .site-footer h4 { margin: 0 0 14px; color: white; }
    .footer-links { display: grid; gap: 9px; }
    .footer-links a:hover { color: var(--gold); }
    .copyright { padding-top: 20px; border-top: 1px solid rgba(255,255,255,.13); text-align: center; font-size: .82rem; }
    .back-top {
      position: fixed; right: 18px; bottom: 18px; z-index: 900;
      width: 46px; height: 46px; display: grid; place-items: center;
      border: 0; border-radius: 50%; color: var(--navy); background: var(--gold);
      box-shadow: 0 8px 25px rgba(0,0,0,.18); font-size: 1.2rem;
      opacity: 0; visibility: hidden; transition: .2s;
    }
    .back-top.show { opacity: 1; visibility: visible; }

    /* =========================================================
       13. ACCESSIBILITY AND RESPONSIVE DESIGN
       ========================================================= */
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .skip-link {
      position: absolute; left: 12px; top: -60px; z-index: 2000;
      padding: 10px 14px; color: white; background: var(--navy); border-radius: 8px;
    }
    .skip-link:focus { top: 12px; }
    @media (max-width: 980px) {
      .nav-links { gap: 13px; }
      .nav-links a { font-size: .82rem; }
      .nav-cta { display: none; }
      .hero-grid { gap: 25px; }
      .class-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 760px) {
      .container { width: min(100% - 30px, var(--page-width)); }
      .section { padding: 66px 0; }
      .announcement-inner { justify-content: center; text-align: center; padding: 7px 0; }
      .nav-wrap { min-height: 70px; }
      .brand-logo { width: 47px; height: 47px; flex-basis: 47px; }
      .brand-name { font-size: .9rem; }
      .menu-toggle { display: block; }
      .nav-links {
        position: absolute; top: 100%; left: 0; right: 0; display: none;
        padding: 16px 22px 22px; background: white; border-bottom: 1px solid var(--line);
        box-shadow: 0 16px 25px rgba(16,43,85,.1); align-items: stretch; flex-direction: column; gap: 0;
      }
      .nav-links.open { display: flex; }
      .nav-links a { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
      .hero-grid { min-height: auto; grid-template-columns: 1fr; padding-block: 62px 78px; }
      .hero h1 { font-size: clamp(2.65rem, 12vw, 4.1rem); }
      .hero-visual { min-height: 330px; margin-top: 5px; }
      .hero-photo-frame { height: 300px; width: min(100%, 470px); }
      .hero-seal { right: 0; width: 82px; height: 82px; font-size: .62rem; }
      .floating-card { left: 0; bottom: 4px; }
      .facts-grid { grid-template-columns: repeat(2, 1fr); }
      .fact:nth-child(2) { border-right: 0; }
      .fact:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .about-grid, .foundation-grid, .contact-grid { grid-template-columns: 1fr; }
